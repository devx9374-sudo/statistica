name: Aggiorna estrazioni
on:
  schedule:
    - cron: '20 17-22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python aggiorna.py
      - name: Salva se ci sono novità
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add *.json modifiche.log 2>/dev/null || git add *.json
          if ! git diff --cached --quiet; then git commit -m "Aggiornamento estrazioni" && git push; fi
